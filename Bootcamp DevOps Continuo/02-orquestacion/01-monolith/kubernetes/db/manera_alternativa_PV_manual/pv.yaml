apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-manual-postgre
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: sclass-todos
  local:
    path: /mnt/kubediscos/postgrepvmanual
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - minikube