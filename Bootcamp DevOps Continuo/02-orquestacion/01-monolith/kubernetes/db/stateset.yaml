apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: todos-postgres
spec:
  selector:
    matchLabels:
      app: todos-postgres
  replicas: 1
  template:
    metadata:
      labels:
        app: todos-postgres
    spec:
      containers:
      - name: todos-postgres
        image: postgres:16
        volumeMounts:
        - name: todosdb-pv
          mountPath: /var/lib/postgresql/data
        - name: db-seed
          mountPath: /docker-entrypoint-initdb.d/
        ports:
        - containerPort: 5432
          name: db
        envFrom:
        - configMapRef:
            name: postgres-config
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pg-password
              key: POSTGRES_PASSWORD
      volumes:
        - name: todosdb-pv
          persistentVolumeClaim:
            claimName: todosdb-pv-claim
        - name: db-seed
          configMap:
            name: cm-db