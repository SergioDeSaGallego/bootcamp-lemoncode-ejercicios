apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: todos-postgres
spec:
  selector:
    matchLabels:
      app: todos-postgres
  serviceName: todos
  replicas: 1
  template:
    metadata:
      labels:
        app: todos-postgres
    spec:
      containers:
      - name: todos-postgres
        image: postgres:16
        volumeMounts:
        - name: todosdb-pv
          mountPath: /var/lib/postgresql/data
        ports:
        - containerPort: 5432
          name: db
        envFrom:
        - configMapRef:
            name: postgres-config
      volumes:
        - name: todosdb-pv
          persistentVolumeClaim:
            claimName: todosdb-pv-claim
        - name: db-seed
          configMap:
              name: cm-db