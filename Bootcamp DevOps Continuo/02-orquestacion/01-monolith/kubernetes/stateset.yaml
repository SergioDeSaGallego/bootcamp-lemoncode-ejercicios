apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mystatefulset
spec:
  selector:
    matchLabels:
      app: todos-postgres
  serviceName: todos
  replicas: 1
  template:
    metadata:
      labels:
        app: todos-postgres
    spec:
      containers:
      - name: todos-postgres
        image: postgres:16
        ports:
        - containerPort: 5432
          name: db
        envFrom:
        - configMapRef:
            name: postgres-config
