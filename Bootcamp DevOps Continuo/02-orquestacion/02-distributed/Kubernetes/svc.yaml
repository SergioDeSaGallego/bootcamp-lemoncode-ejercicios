apiVersion: v1
kind: Service
metadata:
  name: frontend-ip
spec:
  selector:
    app: todo-front
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP

---

apiVersion: v1
kind: Service
metadata:
  name: backend-ip
spec:
  selector:
    app: todo-api
  ports:
  - port: 3001
    targetPort: 3001
  type: ClusterIP
