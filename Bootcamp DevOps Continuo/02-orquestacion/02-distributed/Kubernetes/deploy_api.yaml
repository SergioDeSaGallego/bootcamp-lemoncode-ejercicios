apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-api
  labels:
    app: todo_app
    component: backend
spec:
  selector:
    matchLabels:
      app: todo-api
  template:
    metadata:
      labels:
        app: todo-api
    spec:
      containers:
      - name: todo-api
        image: sdesa/lc-todo-api:latest
        imagePullPolicy: Never
        envFrom:
        - configMapRef:
            name: api-config
        resources:
          limits:
            memory: "512Mi"
            cpu: "1"
          requests:
            memory: "128Mi"
            cpu: "0.5"